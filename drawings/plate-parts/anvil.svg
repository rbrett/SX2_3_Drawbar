<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 427' width='1520' height='854' font-family='Helvetica, Arial, sans-serif'><rect width='760' height='427' fill='white'/><text data-claude-text-id='title' x='24' y='30' font-size='15' font-weight='600' fill='#1f1e1d'>Anvil (1 off) – finished sizes</text><text data-claude-text-id='subtitle' x='24' y='50' font-size='11' fill='#6b6a66'>4140, hardened about 50 HRC and ground. 0,0 = lower-left of the side view, thrust (rear) face at x 0.</text><g data-claude-anchor='anvil-view'><path d='M70 232.2L310 232.2L310 136.2L70 96Z' fill='#2f6fb0' fill-opacity='0.10' stroke='#2f6fb0' stroke-width='1.5'/><circle cx='190' cy='184.2' r='15' fill='none' stroke='#2f6fb0' stroke-width='1.25'/><path d='M187 184.2H193M190 181.2V187.2' stroke='#8a8984' stroke-width='0.6' fill='none'/></g><text data-claude-text-id='lbl-anvil-AN1' x='203.25' y='170.95' font-size='10.5' font-weight='600' fill='#1f1e1d'>AN1</text><text data-claude-text-id='view-anvil-Side-view--both-sides-' x='70' y='84' font-size='12' font-weight='600' fill='#1f1e1d'>Side view (both sides)</text><path d='M70 234.2V242.2' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='ox-anvil-Side-view--both-sides--0' x='73.5' y='244.2' font-size='10' text-anchor='end' transform='rotate(-90 73.5 244.2)' fill='#6b6a66'>0</text><path d='M190 234.2V242.2' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='ox-anvil-Side-view--both-sides--20' x='193.5' y='244.2' font-size='10' text-anchor='end' transform='rotate(-90 193.5 244.2)' fill='#6b6a66'>20</text><path d='M310 234.2V242.2' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='ox-anvil-Side-view--both-sides--40' x='313.5' y='244.2' font-size='10' text-anchor='end' transform='rotate(-90 313.5 244.2)' fill='#6b6a66'>40</text><path d='M68 232.2H60' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='oy-anvil-Side-view--both-sides--0' x='58' y='235.7' font-size='10' text-anchor='end' fill='#6b6a66'>0</text><path d='M68 184.2H60' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='oy-anvil-Side-view--both-sides--8' x='58' y='187.7' font-size='10' text-anchor='end' fill='#6b6a66'>8</text><path d='M68 136.2H60' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='oy-anvil-Side-view--both-sides--16' x='58' y='139.7' font-size='10' text-anchor='end' fill='#6b6a66'>16</text><path d='M68 96H60' stroke='#8a8984' stroke-width='0.75' fill='none'/><text data-claude-text-id='oy-anvil-Side-view--both-sides--22-7' x='58' y='99.5' font-size='10' text-anchor='end' fill='#6b6a66'>22.7</text><text data-claude-text-id='size-anvil-Side-view--both-sides-' x='310' y='84' font-size='10.5' text-anchor='end' fill='#6b6a66'>40 × 22.7</text><circle cx='70' cy='232.2' r='3' fill='#1f1e1d'/><text data-claude-text-id='chart-anvil' x='24' y='298.2' font-size='12' font-weight='600' fill='#1f1e1d'>Hole chart (mm from 0,0 of its view)</text><text data-claude-text-id='hdr-anvil-ID' x='24' y='318.2' font-size='10.5' font-weight='600' fill='#6b6a66'>ID</text><text data-claude-text-id='hdr-anvil-x' x='64' y='318.2' font-size='10.5' font-weight='600' fill='#6b6a66'>x</text><text data-claude-text-id='hdr-anvil-y' x='124' y='318.2' font-size='10.5' font-weight='600' fill='#6b6a66'>y</text><text data-claude-text-id='hdr-anvil-Size---depth' x='184' y='318.2' font-size='10.5' font-weight='600' fill='#6b6a66'>Size · depth</text><path d='M24 323.2H724' stroke='#8a8984' stroke-width='0.75'/><text data-claude-text-id='r-anvil-AN1-0' x='24' y='336.2' font-size='10.5' fill='#1f1e1d'>AN1</text><text data-claude-text-id='r-anvil-AN1-40' x='64' y='336.2' font-size='10.5' fill='#1f1e1d'>20</text><text data-claude-text-id='r-anvil-AN1-100' x='124' y='336.2' font-size='10.5' fill='#1f1e1d'>8</text><text data-claude-text-id='r-anvil-AN1-160' x='184' y='336.2' font-size='10.5' fill='#1f1e1d'>Ø5 H7 (drill 4.8, ream) · 6 deep, each side face</text><text data-claude-text-id='note-anvil-0' x='24' y='370.2' font-size='11' fill='#1f1e1d'>Top at 9.5°, ground in the same sine-bar setting as the wedge underside. Width 40 −0.1/−0.2.</text><text data-claude-text-id='note-anvil-1' x='24' y='387.2' font-size='11' fill='#1f1e1d'>Press a Ø5 m6 × 10 dowel into each hole after hardening, 4 mm proud.</text><text data-claude-text-id='key-anvil' x='24' y='408.2' font-size='10.5' fill='#6b6a66'>Dots mark 0,0. Ordinates are mm from 0,0. Arc over a hole = tapped; double circle = counterbore; dashed = pocket or hidden.</text></svg>