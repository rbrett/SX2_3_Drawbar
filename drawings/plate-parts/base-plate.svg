 fill='#1f1e1d'>Ø6.6 · thru</text><text data-claude-text-id='r-base-plate-B2-0' x='24' y='648.09' font-size='10.5' fill='#1f1e1d'>B2</text><text data-claude-text-id='r-base-plate-B2-40' x='64' y='648.09' font-size='10.5' fill='#1f1e1d'>106.5</text><text data-claude-text-id='r-base-plate-B2-100' x='124' y='648.09' font-size='10.5' fill='#1f1e1d'>100</text><text data-claude-text-id='r-base-plate-B2-160' x='184' y='648.09' font-size='10.5' fill='#1f1e1d'>Ø6.6 · thru</text><text data-claude-text-id='r-base-plate-C1-0' x='24' y='664.09' font-size='10.5' fill='#1f1e1d'>C1</text><text data-claude-text-id='r-base-plate-C1-40' x='64' y='664.09' font-size='10.5' fill='#1f1e1d'>10.5</text><text data-claude-text-id='r-base-plate-C1-100' x='124' y='664.09' font-size='10.5' fill='#1f1e1d'>22</text><text data-claude-text-id='r-base-plate-C1-160' x='184' y='664.09' font-size='10.5' fill='#1f1e1d'>M8 (drill Ø6.8) · thru, square within 0.05</text><text data-claude-text-id='r-base-plate-C2-0' x='24' y='680.09' font-size='10.5' fill='#1f1e1d'>C2</text><text data-claude-text-id='r-base-plate-C2-40' x='64' y='680.09' font-size='10.5' fill='#1f1e1d'>104.5</text><text data-claude-text-id='r-base-plate-C2-100' x='124' y='680.09' font-size='10.5' fill='#1f1e1d'>22</text><text data-claude-text-id='r-base-plate-C2-160' x='184' y='680.09' font-size='10.5' fill='#1f1e1d'>M8 (drill Ø6.8) · thru, square within 0.05</text><text data-claude-text-id='r-base-plate-D1-0' x='24' y='696.09' font-size='10.5' fill='#1f1e1d'>D1</text><text data-claude-text-id='r-base-plate-D1-40' x='64' y='696.09' font-size='10.5' fill='#1f1e1d'>57.5</text><text data-claude-text-id='r-base-plate-D1-100' x='124' y='696.09' font-size='10.5' fill='#1f1e1d'>7.5</text><text data-claude-text-id='r-base-plate-D1-160' x='184' y='696.09' font-size='10.5' fill='#1f1e1d'>Ø6 H7 · thru; drill Ø5.8, ream on the head</text><text data-claude-text-id='r-base-plate-D2-0' x='24' y='712.09' font-size='10.5' fill='#1f1e1d'>D2</text><text data-claude-text-id='r-base-plate-D2-40' x='64' y='712.09' font-size='10.5' fill='#1f1e1d'>8.5</text><text data-claude-text-id='r-base-plate-D2-100' x='124' y='712.09' font-size='10.5' fill='#1f1e1d'>90</text><text data-claude-text-id='r-base-plate-D2-160' x='184' y='712.09' font-size='10.5' fill='#1f1e1d'>Ø6 H7 · thru; drill Ø5.8, ream on the head</text><text data-claude-text-id='note-base-plate-0' x='24' y='746.09' font-size='11' fill='#1f1e1d'>Front corners chamfered 7 × 7. Cut-out R47 on the spindle axis, opening into a slot 80 wide (x 17.5–97.5) to the rear edge.</text><text data-claude-text-id='note-base-plate-1' x='24' y='763.09' font-size='11' fill='#1f1e1d'>D1 leaves a 2.5 web to the R47 cut-out: drill it after profiling and deburr gently.</text><text data-claude-text-id='note-base-plate-2' x='24' y='780.09' font-size='11' fill='#1f1e1d'>A and B: spot through onto the head, drill Ø5.0 through the 9 mm casting and tap M6.</text><text data-claude-text-id='key-base-plate' x='24' y='801.09' font-size='10.5' fill='#6b6a66'>Dots mark 0,0. Ordinates are mm from 0,0. Arc over a hole = tapped; double circle = counterbore; dashed = pocket or hidden.</text></svg>