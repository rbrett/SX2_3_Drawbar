'99.5' font-size='10' text-anchor='end' fill='#6b6a66'>40</text><text data-claude-text-id='size-wear-plate-Top-face' x='430' y='84' font-size='10.5' text-anchor='end' fill='#6b6a66'>60 × 40</text><circle cx='70' cy='336' r='3' fill='#1f1e1d'/><text data-claude-text-id='chart-wear-plate' x='24' y='402' font-size='12' font-weight='600' fill='#1f1e1d'>Hole chart (mm from 0,0 of its view)</text><text data-claude-text-id='hdr-wear-plate-ID' x='24' y='422' font-size='10.5' font-weight='600' fill='#6b6a66'>ID</text><text data-claude-text-id='hdr-wear-plate-x' x='64' y='422' font-size='10.5' font-weight='600' fill='#6b6a66'>x</text><text data-claude-text-id='hdr-wear-plate-y' x='124' y='422' font-size='10.5' font-weight='600' fill='#6b6a66'>y</text><text data-claude-text-id='hdr-wear-plate-Size---depth' x='184' y='422' font-size='10.5' font-weight='600' fill='#6b6a66'>Size · depth</text><path d='M24 427H724' stroke='#8a8984' stroke-width='0.75'/><text data-claude-text-id='r-wear-plate-S1-0' x='24' y='440' font-size='10.5' fill='#1f1e1d'>S1</text><text data-claude-text-id='r-wear-plate-S1-40' x='64' y='440' font-size='10.5' fill='#1f1e1d'>5</text><text data-claude-text-id='r-wear-plate-S1-100' x='124' y='440' font-size='10.5' fill='#1f1e1d'>6</text><text data-claude-text-id='r-wear-plate-S1-160' x='184' y='440' font-size='10.5' fill='#1f1e1d'>M3 (drill Ø2.5 × 3.2 flat) · 3 deep</text><text data-claude-text-id='r-wear-plate-S2-0' x='24' y='456' font-size='10.5' fill='#1f1e1d'>S2</text><text data-claude-text-id='r-wear-plate-S2-40' x='64' y='456' font-size='10.5' fill='#1f1e1d'>55</text><text data-claude-text-id='r-wear-plate-S2-100' x='124' y='456' font-size='10.5' fill='#1f1e1d'>6</text><text data-claude-text-id='r-wear-plate-S2-160' x='184' y='456' font-size='10.5' fill='#1f1e1d'>M3 (drill Ø2.5 × 3.2 flat) · 3 deep</text><text data-claude-text-id='r-wear-plate-S3-0' x='24' y='472' font-size='10.5' fill='#1f1e1d'>S3</text><text data-claude-text-id='r-wear-plate-S3-40' x='64' y='472' font-size='10.5' fill='#1f1e1d'>5</text><text data-claude-text-id='r-wear-plate-S3-100' x='124' y='472' font-size='10.5' fill='#1f1e1d'>34</text><text data-claude-text-id='r-wear-plate-S3-160' x='184' y='472' font-size='10.5' fill='#1f1e1d'>M3 (drill Ø2.5 × 3.2 flat) · 3 deep</text><text data-claude-text-id='r-wear-plate-S4-0' x='24' y='488' font-size='10.5' fill='#1f1e1d'>S4</text><text data-claude-text-id='r-wear-plate-S4-40' x='64' y='488' font-size='10.5' fill='#1f1e1d'>55</text><text data-claude-text-id='r-wear-plate-S4-100' x='124' y='488' font-size='10.5' fill='#1f1e1d'>34</text><text data-claude-text-id='r-wear-plate-S4-160' x='184' y='488' font-size='10.5' fill='#1f1e1d'>M3 (drill Ø2.5 × 3.2 flat) · 3 deep</text><text data-claude-text-id='note-wear-plate-0' x='24' y='522' font-size='11' fill='#1f1e1d'>Drill and tap before hardening; 1.8 of skin is left, so the rolling face stays unbroken.</text><text data-claude-text-id='note-wear-plate-1' x='24' y='539' font-size='11' fill='#1f1e1d'>Harden 58–62 HRC, grind both faces parallel within 0.005.</text><text data-claude-text-id='key-wear-plate' x='24' y='560' font-size='10.5' fill='#6b6a66'>Dots mark 0,0. Ordinates are mm from 0,0. Arc over a hole = tapped; double circle = counterbore; dashed = pocket or hidden.</text></svg>