-41' x='58' y='99.5' font-size='10' text-anchor='end' fill='#6b6a66'>41</text><text data-claude-text-id='size-roller-cage-Plan' x='382' y='84' font-size='10.5' text-anchor='end' fill='#6b6a66'>52 × 41</text><circle cx='70' cy='342' r='3' fill='#1f1e1d'/><text data-claude-text-id='note-roller-cage-0' x='24' y='402' font-size='11' fill='#1f1e1d'>Windows 14.3 × 36.6, centres (17, 20.5) and (35, 20.5), 18 pitch; rollers Ø14 × 36 with 0.3 / 0.6 play.</text><text data-claude-text-id='note-roller-cage-1' x='24' y='419' font-size='11' fill='#1f1e1d'>Tongues 6 × 3 each side carry the centring springs. Break all window edges.</text><text data-claude-text-id='key-roller-cage' x='24' y='440' font-size='10.5' fill='#6b6a66'>Dots mark 0,0. Ordinates are mm from 0,0. Arc over a hole = tapped; double circle = counterbore; dashed = pocket or hidden.</text></svg>