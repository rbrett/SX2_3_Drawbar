<text data-claude-text-id='note-wedge-1' x='24' y='577.62' font-size='11' fill='#1f1e1d'>Width 40 −0.1/−0.2 after grinding. Tap before hardening; the JA nut bears on the trailing end face.</text><text data-claude-text-id='key-wedge' x='24' y='598.62' font-size='10.5' fill='#6b6a66'>Dots mark 0,0. Ordinates are mm from 0,0. Arc over a hole = tapped; double circle = counterbore; dashed = pocket or hidden.</text></svg>